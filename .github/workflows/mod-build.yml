# Builds the SatisfactoTerraform UE mod on a self-hosted Windows runner.
#
# Modeled on the CI of SatisfactoryModLoader and FicsIt-Networks. Expect to
# tweak paths/flags on the first run — UAT is picky and the engine release
# layout changes occasionally.
#
# Runner prerequisites (one-time, see docs/mod-ci.md):
#   - Self-hosted Windows runner registered on this repo, installed to a short
#     path (e.g. C:\CI) to dodge Windows path-length limits.
#   - Visual Studio 2022 with the SMR-documented workloads, Git, Git LFS, 7zip.
#   - Repo secrets:
#       ENGINE_GH_TOKEN  - PAT of a GitHub account that has been granted access
#                          to satisfactorymodding/UnrealEngine (link your Epic
#                          account per docs.ficsit.app to get it).
#       WWISE_EMAIL / WWISE_PASSWORD - Audiokinetic credentials for wwise-cli.
#
# SECURITY: runs only on push to trusted branches + manual dispatch. Never add
# pull_request here — fork PRs would execute arbitrary code on your PC.

name: mod-build

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "mod/**"
      - ".github/workflows/mod-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Everything heavyweight lives outside the workspace so it survives between
  # runs on the self-hosted runner (the engine alone is tens of GB).
  UE_ROOT: C:\CI\UE
  WWISE_CACHE: C:\CI\Wwise
  ENGINE_VERSION_TAG: ""   # empty = latest release of satisfactorymodding/UnrealEngine
  SML_REF: master           # pin to a tag (e.g. v3.11.1) for reproducible builds
  MOD_REFERENCE: SatisfactoTerraform

jobs:
  build:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 240
    steps:
      # SML's repo IS the modding project: FactoryGame.uproject + Mods/ dir.
      # Our mod is checked out inside its Mods folder.
      - name: Checkout SatisfactoryModLoader (starter project)
        uses: actions/checkout@v7
        with:
          repository: satisfactorymodding/SatisfactoryModLoader
          ref: ${{ env.SML_REF }}
          path: SatisfactoryModLoader

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: satisfacto-form

      - name: Place mod into project
        shell: pwsh
        run: |
          $dest = "SatisfactoryModLoader\Mods\${{ env.MOD_REFERENCE }}"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Copy-Item -Recurse satisfacto-form\mod $dest

      - name: Preflight (secrets + tools)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ENGINE_GH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrEmpty($env:GH_TOKEN)) {
            Write-Error "Repo secret ENGINE_GH_TOKEN is not set (or empty). See docs/mod-ci.md."
          }
          gh auth status 2>&1 | Out-Host
          # winget installs 7-Zip without adding it to PATH; resolve it explicitly.
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            foreach ($candidate in @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe")) {
              if (Test-Path $candidate) { $sevenZip = $candidate; break }
            }
          }
          if (-not $sevenZip) {
            Write-Error "7z.exe not found on PATH or in Program Files. Install 7-Zip on the runner."
          }
          Write-Host "Using 7-Zip at: $sevenZip"
          "SEVEN_ZIP=$sevenZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install custom engine (cached on runner disk)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ENGINE_GH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "${{ env.UE_ROOT }}\Engine\Build\BatchFiles\Build.bat") {
            Write-Host "Engine already present at ${{ env.UE_ROOT }}, skipping download."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path "${{ env.UE_ROOT }}" | Out-Null
          $tagArgs = @()
          if ("${{ env.ENGINE_VERSION_TAG }}" -ne "") { $tagArgs = @("${{ env.ENGINE_VERSION_TAG }}") }
          # The release ships as split 7z parts: UnrealEngine-CSS-Editor-Win64.7z.001 ...
          gh release download @tagArgs --repo satisfactorymodding/UnrealEngine `
            --pattern "UnrealEngine-CSS-Editor-Win64.7z*" --dir "${{ env.UE_ROOT }}\_dl"
          if ($LASTEXITCODE -ne 0) { Write-Error "gh release download failed (check ENGINE_GH_TOKEN access to satisfactorymodding/UnrealEngine)" }
          $firstPart = Get-ChildItem "${{ env.UE_ROOT }}\_dl" -Filter "*.7z.001" | Select-Object -First 1
          if (-not $firstPart) { Write-Error "No .7z.001 part downloaded - release asset layout may have changed; list assets with: gh release view --repo satisfactorymodding/UnrealEngine" }
          & $env:SEVEN_ZIP x $firstPart.FullName -o"${{ env.UE_ROOT }}" -y
          if ($LASTEXITCODE -ne 0) { Write-Error "7z extraction failed" }
          Remove-Item -Recurse -Force "${{ env.UE_ROOT }}\_dl"
          # Register the engine build + install prerequisites (script name has
          # moved between releases; run whichever exists).
          $setup = Get-ChildItem "${{ env.UE_ROOT }}" -Filter "Setup*.bat" -Recurse -Depth 2 | Select-Object -First 1
          if ($setup) { & $setup.FullName }

      - name: Register engine build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # wwise-cli (and other UE tooling) resolves the engine through the
          # registered-builds registry key, keyed by the uproject's
          # EngineAssociation (e.g. 5.6.1-CSS). Registering is idempotent.
          $assoc = (Get-Content "SatisfactoryModLoader\FactoryGame.uproject" -Raw | ConvertFrom-Json).EngineAssociation
          if ([string]::IsNullOrEmpty($assoc)) { Write-Error "No EngineAssociation in FactoryGame.uproject" }
          New-Item -Path "HKCU:\SOFTWARE\Epic Games\Unreal Engine\Builds" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Epic Games\Unreal Engine\Builds" -Name $assoc -Value "${{ env.UE_ROOT }}"
          Write-Host "Registered engine build '$assoc' -> ${{ env.UE_ROOT }}"

      - name: Integrate Wwise (cached on runner disk)
        shell: pwsh
        env:
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
          GH_TOKEN: ${{ secrets.ENGINE_GH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrEmpty($env:WWISE_EMAIL) -or [string]::IsNullOrEmpty($env:WWISE_PASSWORD)) {
            Write-Error "Repo secrets WWISE_EMAIL / WWISE_PASSWORD are not set. See docs/mod-ci.md."
          }
          # wwise-cli (mircearoata/wwise-cli, same tool SML CI uses) downloads
          # the Wwise SDK once into the cache dir and integrates it into the
          # project's Plugins folder on every run.
          if (-not (Test-Path "C:\CI\wwise-cli.exe")) {
            # Release assets are named with underscores: wwise-cli_windows_amd64.exe
            gh release download --repo mircearoata/wwise-cli --pattern "wwise-cli_windows_amd64.exe" --dir C:\CI
            if ($LASTEXITCODE -ne 0) { Write-Error "wwise-cli download failed" }
            Rename-Item C:\CI\wwise-cli_windows_amd64.exe wwise-cli.exe
          }
          # Filters and versions mirror SML's own build.yml (sdk-version and
          # integration-version are intentionally different). The empty
          # DeploymentPlatforms filter includes the platform-agnostic files.
          C:\CI\wwise-cli.exe download --sdk-version "2023.1.14.8770" `
            --filter "Packages=SDK" `
            --filter "DeploymentPlatforms=Windows_vc160" `
            --filter "DeploymentPlatforms=Windows_vc170" `
            --filter "DeploymentPlatforms=Linux" `
            --filter "DeploymentPlatforms=" `
            --email $env:WWISE_EMAIL --password $env:WWISE_PASSWORD `
            --cache-dir "${{ env.WWISE_CACHE }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "wwise-cli download of the SDK failed" }
          C:\CI\wwise-cli.exe integrate-ue --integration-version "2023.1.14.3555" `
            --project "$PWD\SatisfactoryModLoader\FactoryGame.uproject" `
            --email $env:WWISE_EMAIL --password $env:WWISE_PASSWORD `
            --cache-dir "${{ env.WWISE_CACHE }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "wwise-cli integrate-ue failed" }

      - name: Build editor binaries
        shell: pwsh
        run: |
          & "${{ env.UE_ROOT }}\Engine\Build\BatchFiles\Build.bat" `
            FactoryEditor Win64 Development `
            -project="$PWD\SatisfactoryModLoader\FactoryGame.uproject"
          if ($LASTEXITCODE -ne 0) { Write-Error "editor build failed" }

      - name: Package mod (client Win64 + dedicated servers Win64/Linux)
        shell: pwsh
        run: |
          & "${{ env.UE_ROOT }}\Engine\Build\BatchFiles\RunUAT.bat" `
            -ScriptsForProject="$PWD\SatisfactoryModLoader\FactoryGame.uproject" `
            PackagePlugin `
            -project="$PWD\SatisfactoryModLoader\FactoryGame.uproject" `
            -dlcname=${{ env.MOD_REFERENCE }} `
            -merge -build -server

      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOD_REFERENCE }}
          path: |
            SatisfactoryModLoader/Saved/ArchivedPlugins/${{ env.MOD_REFERENCE }}/*.zip
          if-no-files-found: error
