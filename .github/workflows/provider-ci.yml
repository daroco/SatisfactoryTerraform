name: provider-ci

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "mod/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "mod/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/mockserver/ ./internal/client/...

      - name: Acceptance tests (against mockserver)
        run: go test ./internal/provider/ -v -timeout 10m
        env:
          TF_ACC: "1"

      - name: Example applies against mockserver
        run: |
          go build -o /tmp/terraform-provider-satisfactory .
          go build -o /tmp/mockserver ./cmd/mockserver
          /tmp/mockserver -addr :8090 &
          MOCK_PID=$!
          trap "kill $MOCK_PID" EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/api/v1/health && break
            [ "$i" = 30 ] && { echo "mockserver never became healthy"; exit 1; }
            sleep 1
          done
          cat > /tmp/dev.tfrc <<EOF
          provider_installation {
            dev_overrides {
              "daroco/satisfactory" = "/tmp"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE=/tmp/dev.tfrc
          for dir in examples/*/; do
            echo "--- $dir ---"
            ( cd "$dir" \
              && terraform apply -auto-approve \
              && terraform plan -detailed-exitcode \
              && terraform destroy -auto-approve )
          done
