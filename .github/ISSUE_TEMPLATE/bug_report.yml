name: Bug report
description: Something in the mod misbehaves in-game or over the API.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This mod is the in-game half of a two-repo
        project. If the problem is in the Terraform provider, the plan/apply
        behaviour, or the API contract itself, please file it in
        [terraform-provider-satisfactory](https://github.com/daroco/terraform-provider-satisfactory)
        instead. Bugs in spawning, dismantling, persistence, or the HTTP server
        belong here.

        **Do not report security vulnerabilities here** — see
        [SECURITY.md](https://github.com/daroco/SatisfactoryTerraform/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Ideally the exact API request(s) or the Terraform config/command. A
        minimal case is far more useful than a full factory.
      placeholder: |
        1. Start a single-player session with the mod loaded
        2. curl -X POST http://localhost:8090/api/v1/buildables -d '{...}'
        3. ...
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: From the .uplugin / ficsit.app, e.g. 0.1.0.
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Satisfactory + SML version
      description: e.g. Game 1.1 (CL-386932), SML 3.11.1.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Single-player client
        - Listen (host) session
        - Dedicated server
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: >
        Relevant lines from FactoryGame.log, and the full crash callstack if it
        crashed. This will be automatically formatted as code, so no backticks
        needed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is a bug in the mod, not the Terraform provider.
          required: true
